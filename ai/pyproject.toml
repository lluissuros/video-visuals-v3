[project]
name = "vv3-ai"
version = "0.1.0"
description = "Local real-time img2img service for video-visuals-v3 (Core ML, Apple Silicon)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7,<2.8",
  "diffusers>=0.33",
  "transformers>=4.45",
  "accelerate>=1.0",
  "coremltools>=9.0",
  "numpy<2",  # coremltools 9 int() casts break on numpy 2
  "opencv-python-headless>=4.9",
  "websockets>=13",
  "huggingface_hub",
  "peft>=0.13",
]

[tool.uv]
package = false
