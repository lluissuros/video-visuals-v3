<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>video-visuals-v3</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #maskdebug {
      position: fixed; right: 12px; bottom: 12px; width: 256px; height: 144px;
      border: 1px solid #444; display: none; z-index: 5;
    }
    #panel {
      position: fixed; top: 14px; left: 14px; z-index: 10; width: 250px;
      background: rgba(10, 10, 12, 0.82); color: #ddd; border-radius: 10px;
      padding: 12px 14px; font: 12px/1.5 ui-monospace, Menlo, monospace;
      backdrop-filter: blur(6px); user-select: none;
    }
    #panel .title { color: #f55; letter-spacing: 0.08em; margin-bottom: 2px; }
    #panel .scene { color: #999; margin-bottom: 6px; }
    #panel .waves { display: block; margin-bottom: 8px; }
    #panel .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #panel .row span { width: 52px; color: #aaa; }
    #panel .row input[type=range] { flex: 1; accent-color: #f55; height: 14px; }
    #panel .row button {
      background: #222; color: #888; border: 1px solid #333; border-radius: 4px;
      font: 10px ui-monospace, monospace; padding: 1px 5px; cursor: pointer;
    }
    #panel .status { margin-top: 8px; color: #7a7; }
    #panel .help { margin-top: 4px; color: #555; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="maskdebug" width="256" height="144"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
