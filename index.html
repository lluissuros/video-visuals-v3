<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>video-visuals-v3</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    body.nocursor, body.nocursor * { cursor: none !important; }
    #maskdebug {
      position: fixed; right: 12px; bottom: 12px; width: 256px; height: 144px;
      border: 1px solid #444; display: none; z-index: 5; background: #111;
    }
    #panel {
      position: fixed; top: 14px; left: 14px; z-index: 10; width: 264px;
      background: rgba(10, 10, 12, 0.84); color: #ddd; border-radius: 10px;
      padding: 12px 14px; font: 12px/1.5 ui-monospace, Menlo, monospace;
      backdrop-filter: blur(6px); user-select: none;
      max-height: calc(100vh - 40px); overflow-y: auto;
    }
    #panel .title { color: #f55; letter-spacing: 0.08em; margin-bottom: 2px; }
    #panel .section { margin: 10px 0 3px; }
    #panel .section > summary {
      color: #666; text-transform: uppercase; letter-spacing: 0.12em;
      font-size: 10px; cursor: pointer; list-style: none; padding: 1px 0;
    }
    #panel .section > summary::-webkit-details-marker { display: none; }
    #panel .section > summary::before { content: '▾ '; color: #444; }
    #panel .section:not([open]) > summary::before { content: '▸ '; }
    #panel .section > summary:hover { color: #999; }
    #panel .top-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    #panel .top-row select { flex: 1; min-width: 0; margin-bottom: 0; }
    #panel .mode { color: #999; flex: 1; }
    #panel .waves { display: block; margin: 4px 0 2px; }
    #panel select {
      width: 100%; background: #1a1a1e; color: #ccc; border: 1px solid #333;
      border-radius: 4px; font: 11px ui-monospace, monospace; padding: 3px;
      margin-bottom: 4px;
    }
    #panel .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #panel .row span { width: 52px; color: #aaa; }
    #panel .row .val { width: 42px; color: #888; text-align: right; }
    #panel .row input[type=range] { flex: 1; accent-color: #f55; height: 14px; min-width: 0; }
    #panel .xy-row { display: flex; gap: 8px; margin: 4px 0 6px; }
    #panel .xy {
      position: relative; flex: 1; aspect-ratio: 1; background: #16161a;
      border: 1px solid #333; border-radius: 4px; cursor: crosshair; touch-action: none;
      background-image:
        linear-gradient(#26262b 1px, transparent 1px),
        linear-gradient(90deg, #26262b 1px, transparent 1px);
      background-size: 25% 25%;
    }
    #panel .xy .dot {
      position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px;
      border-radius: 50%; background: #f55; box-shadow: 0 0 6px #f55a; pointer-events: none;
    }
    #panel .xy .neutral {
      position: absolute; left: 0; right: 0; height: 0;
      border-top: 1px dashed #7a7; opacity: 0.8; pointer-events: none;
    }
    #panel .xy .lx, #panel .xy .ly {
      position: absolute; color: #666; font-size: 9px; pointer-events: none;
    }
    #panel .xy .lx { right: 4px; bottom: 2px; }
    #panel .xy .ly { left: 4px; top: 2px; }
    #panel button {
      background: #222; color: #888; border: 1px solid #333; border-radius: 4px;
      font: 10px ui-monospace, monospace; padding: 1px 6px; cursor: pointer;
    }
    #panel button.on { background: #611; color: #f88; border-color: #a33; }
    #panel button.icon {
      width: 22px; height: 22px; padding: 0; display: inline-flex;
      align-items: center; justify-content: center;
    }
    #panel [hidden] { display: none !important; }
    #panel .btn-row { display: flex; gap: 6px; margin: 4px 0; }
    #panel .btn-row button { padding: 3px 8px; }
    #panel .status { margin-top: 8px; color: #7a7; }
    #perf {
      position: fixed; top: 14px; right: 14px; z-index: 10; text-align: right;
      color: #888; font: 11px/1.45 ui-monospace, Menlo, monospace;
      background: rgba(10, 10, 12, 0.7); border-radius: 8px; padding: 8px 10px;
      user-select: none;
    }
    #perf .light { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px; }
    #perf .dot { width: 14px; height: 14px; border-radius: 50%; background: #4c4; box-shadow: 0 0 10px #4c4; }
    #perf.ok .word { color: #6d6; }
    #perf.warm .dot { background: #eb4; box-shadow: 0 0 10px #eb4; }
    #perf.warm .word { color: #ec6; }
    #perf.hot .dot { background: #f44; box-shadow: 0 0 12px #f44; animation: perf-blink 1s steps(2) infinite; }
    #perf.hot .word { color: #f66; }
    @keyframes perf-blink { to { opacity: 0.35; } }
    #perf .nums { white-space: pre; color: #666; font-size: 10px; margin-top: 4px; }
    #panel .help { margin-top: 4px; color: #555; }
    #instructions {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; width: min(560px, 90vw); max-height: 84vh; overflow-y: auto;
      background: rgba(8, 8, 10, 0.94); color: #ccc; border-radius: 12px;
      border: 1px solid #333; padding: 18px 22px;
      font: 12px/1.6 ui-monospace, Menlo, monospace;
    }
    #instructions h2 {
      color: #f55; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.12em; margin: 12px 0 6px;
    }
    #instructions table { border-collapse: collapse; width: 100%; }
    #instructions td { padding: 1px 8px 1px 0; vertical-align: top; }
    #instructions td:first-child { color: #f88; white-space: nowrap; width: 90px; }
    #instructions p { color: #999; }
    #instructions code { color: #f88; }
    #qr {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; background: #fff; color: #222; border-radius: 12px;
      padding: 18px 22px; text-align: center; cursor: pointer;
      font: 12px/1.6 ui-monospace, Menlo, monospace;
    }
    #qr canvas { display: block; margin: 0 auto 8px; }
    #qr p { margin: 0; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="maskdebug" width="256" height="144"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
