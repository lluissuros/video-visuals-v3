<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>video-visuals-v3</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #maskdebug {
      position: fixed; right: 12px; bottom: 12px; width: 256px; height: 144px;
      border: 1px solid #444; display: none; z-index: 5; background: #111;
    }
    #panel {
      position: fixed; top: 14px; left: 14px; z-index: 10; width: 264px;
      background: rgba(10, 10, 12, 0.84); color: #ddd; border-radius: 10px;
      padding: 12px 14px; font: 12px/1.5 ui-monospace, Menlo, monospace;
      backdrop-filter: blur(6px); user-select: none;
      max-height: calc(100vh - 40px); overflow-y: auto;
    }
    #panel .title { color: #f55; letter-spacing: 0.08em; margin-bottom: 2px; }
    #panel .section {
      color: #666; text-transform: uppercase; letter-spacing: 0.12em;
      font-size: 10px; margin: 10px 0 3px;
    }
    #panel .scene-row { display: flex; align-items: center; gap: 8px; }
    #panel .scene { color: #999; flex: 1; }
    #panel .waves { display: block; margin: 4px 0 2px; }
    #panel select {
      width: 100%; background: #1a1a1e; color: #ccc; border: 1px solid #333;
      border-radius: 4px; font: 11px ui-monospace, monospace; padding: 3px;
      margin-bottom: 4px;
    }
    #panel .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    #panel .row span { width: 52px; color: #aaa; }
    #panel .row .val { width: 42px; color: #888; text-align: right; }
    #panel .row input[type=range] { flex: 1; accent-color: #f55; height: 14px; min-width: 0; }
    #panel button {
      background: #222; color: #888; border: 1px solid #333; border-radius: 4px;
      font: 10px ui-monospace, monospace; padding: 1px 6px; cursor: pointer;
    }
    #panel button.on { background: #611; color: #f88; border-color: #a33; }
    #panel .btn-row { display: flex; gap: 6px; margin: 4px 0; }
    #panel .btn-row button { padding: 3px 8px; }
    #panel .status { margin-top: 8px; color: #7a7; }
    #panel .help { margin-top: 4px; color: #555; }
    #instructions {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 20; width: min(560px, 90vw); max-height: 84vh; overflow-y: auto;
      background: rgba(8, 8, 10, 0.94); color: #ccc; border-radius: 12px;
      border: 1px solid #333; padding: 18px 22px;
      font: 12px/1.6 ui-monospace, Menlo, monospace;
    }
    #instructions h2 {
      color: #f55; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.12em; margin: 12px 0 6px;
    }
    #instructions table { border-collapse: collapse; width: 100%; }
    #instructions td { padding: 1px 8px 1px 0; vertical-align: top; }
    #instructions td:first-child { color: #f88; white-space: nowrap; width: 90px; }
    #instructions p { color: #999; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <canvas id="maskdebug" width="256" height="144"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
